name: race

# 竞态检测器门禁：在 Linux runner 上跑 `go test -race ./...`。
# 本机（Windows 沙箱）无 C 编译器且所有 gcc 二进制源被网络代理封禁，无法本地跑 -race；
# 因此把竞态检测放到 CI，保证可复现、不污染本地环境。
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/race.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/race.yml'
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true
          # 本项目零第三方依赖（不生成 go.sum），默认的模块缓存会因找不到 key 文件
          # 每次都报 "Restore cache failed"，白白产生一条黄色告警。
          cache: false
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Race detector test
        run: go test -race -count=1 ./...
      - name: Coverage (race build)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
